<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://husseinmohamed99.github.io/projects/all-projects.html"/>
<script>
(function() {
  const p = new URLSearchParams(window.location.search);
  const s = p.get("slug");
  if (s) {
    p.delete("slug");
    const q = p.toString();
    const hash = window.location.hash || "";
    const target = encodeURIComponent(s) + "/" + (q ? ("?" + q) : "") + hash;
    window.location.replace(target);
  } else {
    window.location.replace("all-projects.html");
  }
})();
</script>
