backend:
  name: github
  repo: HusseinMohamed99/HusseinMohamed99.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Where uploaded images/videos are stored
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "data/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{category}}"
    fields:
      # ===== Card / Hero basics =====
      - { label: "Project Name", name: "name", widget: "string" }
      - { label: "Category / Tagline", name: "category", widget: "string" }
      - label: "Badge"
        name: "badge"
        widget: "select"
        options: ["Featured Project", "Personal Project", "Graduation", "Company Project"]
      - { label: "Short Card Description (shown on homepage grid)", name: "short_description", widget: "text" }
      - label: "App Icon"
        name: "icon"
        widget: "image"
        required: false
      - { label: "Display Order (lower = first)", name: "order", widget: "number", default: 0 }

      # ===== Case Study: Overview =====
      - { label: "Overview Paragraph", name: "overview", widget: "markdown", required: false }
      - label: "Overview Stats (the 3 highlight numbers)"
        name: "stats"
        widget: "list"
        required: false
        summary: "{{fields.number}} — {{fields.label}}"
        fields:
          - { label: "Number / Short Value (e.g. '3', 'Live', 'AR / EN')", name: "number", widget: "string" }
          - { label: "Label", name: "label", widget: "string" }

      # ===== Case Study: Core Capabilities =====
      - label: "Core Capabilities"
        name: "capabilities"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Emoji Icon (e.g. 💳)", name: "icon", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }

      # ===== Case Study: Architecture =====
      - { label: "Architecture Paragraph", name: "architecture_text", widget: "markdown", required: false }
      - label: "Architecture Flow Steps (in order)"
        name: "architecture_flow"
        widget: "list"
        required: false
        field: { label: "Step", name: "step", widget: "string" }

      # ===== Case Study: Walkthrough =====
      - label: "Screenshots Banner (optional, full-width image)"
        name: "banner"
        widget: "image"
        required: false
      - label: "Screenshots / Mockups"
        name: "mockups"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string" }
      - label: "Demo Video (MP4, keep under 20MB)"
        name: "video"
        widget: "file"
        required: false
        media_library:
          config:
            max_file_size: 20971520

      # ===== Case Study: Problems Solved =====
      - label: "Problems Solved"
        name: "challenges"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Label (e.g. 'Strategy Pattern')", name: "label", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "text" }

      # ===== Tech + Links =====
      - label: "Tech Tags"
        name: "tech_tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - label: "Links"
        name: "links"
        widget: "object"
        required: false
        fields:
          - { label: "GitHub", name: "github", widget: "string", required: false }
          - { label: "App Store", name: "app_store", widget: "string", required: false }
          - { label: "Google Play", name: "google_play", widget: "string", required: false }
